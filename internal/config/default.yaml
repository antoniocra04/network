# Default checks. Copy to /data/config.yaml and edit: any list given there
# replaces the corresponding list below. Any site can be checked by hand on
# the «Проверить сайт» page.

listen: ":8083"
data_dir: "./data"

intervals:
  ping: 15s
  sites: 60s
  throttle: 5m
  public_ip: 5m
  route: 10m

# ICMP targets. The router and the first ISP hop are found automatically.
anchors:
  - { id: ya-dns,  name: "Яндекс DNS",   layer: runet,   host: 77.88.8.8 }
  - { id: ya-dns2, name: "Яндекс DNS 2", layer: runet,   host: 77.88.8.1 }
  - { id: cf-dns,  name: "Cloudflare",   layer: foreign, host: 1.1.1.1 }
  - { id: g-dns,   name: "Google DNS",   layer: foreign, host: 8.8.8.8 }
  - { id: q9,      name: "Quad9",        layer: foreign, host: 9.9.9.9 }

# Sites that define whether a segment works at all.
sites:
  - { id: yandex,    name: "Яндекс",     layer: runet,   url: "https://ya.ru/" }
  - { id: vk,        name: "VK",         layer: runet,   url: "https://vk.com/" }
  - { id: mailru,    name: "Mail.ru",    layer: runet,   url: "https://mail.ru/" }
  - { id: gosuslugi, name: "Госуслуги",  layer: runet,   url: "https://www.gosuslugi.ru/" }
  - { id: ozon,      name: "Ozon",       layer: runet,   url: "https://www.ozon.ru/" }
  - { id: google,    name: "Google",     layer: foreign, url: "https://www.google.com/" }
  - { id: cloudflare,name: "Cloudflare", layer: foreign, url: "https://www.cloudflare.com/" }
  - { id: wikipedia, name: "Wikipedia",  layer: foreign, url: "https://en.wikipedia.org/" }
  - { id: microsoft, name: "Microsoft",  layer: foreign, url: "https://www.microsoft.com/" }
  - { id: apple,     name: "Apple",      layer: foreign, url: "https://www.apple.com/" }

# Large files on foreign hosting. A connection that stalls at ~16 KB is the
# signature of the cut-off applied to these providers.
throttle:
  - { id: t-cloudflare, name: "Cloudflare", url: "https://speed.cloudflare.com/__down?bytes=131072" }
  - { id: t-hetzner,    name: "Hetzner DE", url: "https://fsn1-speed.hetzner.com/100MB.bin" }
  - { id: t-hetzner-us, name: "Hetzner US", url: "https://ash-speed.hetzner.com/100MB.bin" }
  - { id: t-ovh,        name: "OVH",        url: "https://proof.ovh.net/files/1Mb.dat" }
